[build-system]
requires = ["scikit-build-core>=0.10", "swig==4.5.1"]
build-backend = "scikit_build_core.build"

[project]
name = "ogre-oggsound"
version = "14.6.2"
description = "OgreOggSound audio bindings for ogre-python"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ian Stangoe" }]
maintainers = [{ name = "Pavel Rojtberg" }]
dependencies = ["ogre-python>=14.6.2,<14.7"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://www.ogre3d.org"
Source = "https://github.com/OGRECave/ogre-audiovideo"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.18"
wheel.packages = []
cmake.args = [
    "-DCMAKE_BUILD_TYPE=Release",
    "-DBUILD_VIDEOPLUGIN=OFF",
    "-DBUILD_DEMOS=OFF",
    "-DOGGSOUND_PYTHON=ON",
    "-DOGGSOUND_STATIC=ON",
    "-DOGGSOUND_INSTALL_DEVEL=OFF",
    "-DOGGSOUND_USE_MOJOAL=ON",
]
